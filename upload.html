<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>העלאת תמונות - שש וארגמן</title>
  <link href="https://fonts.googleapis.com/css?family=Varela+Round&display=swap&subset=hebrew" rel="stylesheet">
  <style>
    body { font-family: 'Varela Round', sans-serif; background: #fffcfc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    h1 { font-size: 2rem; color: #1a1a1a; margin-bottom: 2rem; }
    #upload-btn { background: #F3DAD8; border: none; padding: 1rem 2.5rem; font-size: 1.2rem; font-family: 'Varela Round', sans-serif; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
    #upload-btn:hover { background: #e8c5c2; }
  </style>
</head>
<body>
  <h1>העלאת תמונות לגלריה</h1>
  <button id="upload-btn">בחרי תמונות להעלאה</button>
  <script src="https://upload-widget.cloudinary.com/global/all.js"></script>
  <script>
    var widget = cloudinary.createUploadWidget({
      cloudName: 'dzcgfmw7v',
      uploadPreset: 'ourBrides',
      sources: ['local'],
      multiple: true
    }, function(error, result) {
      if (result && result.event === 'success') {
        console.log('עלתה בהצלחה:', result.info.public_id);
      }
    });
    document.getElementById('upload-btn').addEventListener('click', function() {
      widget.open();
    });
  </script>
</body>
</html>
